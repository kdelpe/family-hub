<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>People</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Source+Sans+3:wght@400;600&amp;display=swap">
<style>
body{margin:0}
nav[aria-label="Main"] > div > a{transition:background-color .15s ease, box-shadow .15s ease}
nav[aria-label="Main"] > div > a:hover, nav[aria-label="Main"] > div > a:focus-visible{background-color:#EFE7D8;box-shadow:0 1px 3px rgba(43,38,32,.12)}
a{color:#2F5D50}a:hover{color:#1E3F36}
@keyframes fh-swapc{0%{opacity:0}12%{opacity:1}42%{opacity:1}54%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.fh-card{transition:transform .15s ease, box-shadow .15s ease}
.fh-card:hover,.fh-card:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px rgba(43,38,32,.12)}
.fh-btn{transition:box-shadow .15s ease, translate .15s ease}
.fh-btn:hover,.fh-btn:focus-visible{box-shadow:0 4px 12px rgba(43,38,32,.16);translate:0 -1px}
.fh-btn:active{translate:0 0;box-shadow:0 1px 3px rgba(43,38,32,.12)}
</style>
</helmet>
<div style="width: 100%; min-height: 1260px; box-sizing: border-box; background: #F6F1E7; color: #2B2620; font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 17px; display: flex; flex-wrap: wrap">

  <nav aria-label="Main" style="flex: 1 1 220px; max-width: 260px; box-sizing: border-box; padding: 32px 24px; border-right: 1px solid #E2D9C8; display: flex; flex-direction: column; gap: 28px">
    <a href="Home-Hearth.dc.html" aria-label="Pluviose-Monestime Family Hub, home" style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: #2B2620; text-decoration: none">
      <svg aria-hidden="true" width="52" height="52" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="25" fill="#E6EEE9" stroke="#2F5D50" stroke-width="1.5"></circle>
        <path d="M26 42 V24 M26 30 L17 22 M26 30 L35 22 M26 24 L26 15" fill="none" stroke="#2F5D50" stroke-width="2.4" stroke-linecap="round"></path>
        <circle cx="26" cy="13" r="4" fill="#2F5D50"></circle>
        <circle cx="16" cy="20" r="3.4" fill="#8A6F4A"></circle>
        <circle cx="36" cy="20" r="3.4" fill="#8A6F4A"></circle>
      </svg>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 3px">
        <span style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; line-height: 1.15">Pluviose-Monestime</span>
        <span style="font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B6358">Family Hub</span>
      </span>
    </a>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="Home-Hearth.dc.html" style="padding: 12px 14px; border-radius: 8px; color: #2B2620; text-decoration: none">Home</a>
      <a href="Main.dc.html" style="padding: 12px 14px; border-radius: 8px; color: #2B2620; text-decoration: none">Family tree</a>
      <a href="People.dc.html" aria-current="page" style="padding: 12px 14px; border-radius: 8px; background: #E9E0CF; color: #2B2620; text-decoration: none; font-weight: 600">People</a>
      <a href="Directory.dc.html" style="padding: 12px 14px; border-radius: 8px; color: #2B2620; text-decoration: none">Directory</a>
      <a href="Events.dc.html" style="padding: 12px 14px; border-radius: 8px; color: #2B2620; text-decoration: none">Events</a>
      <a href="Stories.dc.html" style="padding: 12px 14px; border-radius: 8px; color: #2B2620; text-decoration: none">Stories</a>
      <a href="My-Profile.dc.html" style="padding: 12px 14px; border-radius: 8px; color: #2B2620; text-decoration: none">My profile</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 16px; border-top: 1px solid #E2D9C8">
      <span style="padding: 0 14px 4px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B6358">Admin</span>
      <a href="Manage-Access.dc.html" style="padding: 12px 14px; border-radius: 8px; color: #2B2620; text-decoration: none">Members &amp; invites</a>
    </div>
    <div style="margin-top: auto; font-size: 14px; color: #6B6358">Signed in as Maya</div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 40px; font-weight: 500; flex: 1 1 auto">People</h1>
      <label for="pl-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search people</label>
      <input id="pl-search" type="search" placeholder="Search by name…" style="height: 48px; width: 300px; max-width: 100%; box-sizing: border-box; padding: 0 16px; border: 1px solid #CFC4AF; border-radius: 24px; background: #FFFDF8; font: inherit; color: #2B2620">
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="padding: 6px 14px; border-radius: 16px; background: #E6EEE9; font-size: 15px"><strong>38</strong> people</span>
      <span style="padding: 6px 14px; border-radius: 16px; background: #F1EADC; font-size: 15px"><strong>5</strong> generations</span>
      <span style="padding: 6px 14px; border-radius: 16px; background: #F1EADC; font-size: 15px">Pluviose &amp; Monestime lines</span>
      <span style="padding: 6px 14px; border-radius: 16px; background: #F1EADC; font-size: 15px">Earliest record: c. 1900, Jacmel</span>
    </div>

    <div role="group" aria-label="Filter people" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button class="fh-btn" type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}"  style="height: 44px; padding: 0 18px; border: 1px solid {{f.border}}; border-radius: 22px; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-weight: {{f.weight}}">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="20">
        <a href="Person-Profile.dc.html" class="fh-card" style="position: relative; overflow: hidden; border-radius: 18px; background: #FFFDF8; border: {{p.border}}; color: #2B2620; text-decoration: none; display: flex; flex-direction: column; align-items: center; text-align: center">
          <span aria-hidden="true" style="position: relative; align-self: stretch; height: 64px; background: {{p.band}}">
            <svg viewBox="0 0 200 64" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 40px"><path d="M0 58 Q26 30 54 42 Q88 12 120 36 Q152 20 200 48" fill="none" stroke="#D9CDB5" stroke-width="1.4" vector-effect="non-scaling-stroke"></path></svg>
          </span>
          <span style="position: relative; overflow: hidden; margin-top: -40px; width: 80px; height: 80px; border-radius: 50%; background: {{p.avBg}}; color: {{p.avFg}}; box-shadow: 0 0 0 4px #FFFDF8, 0 0 0 6px #D9CDB5; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-size: 26px">{{p.initials}}<span aria-hidden="true" style="position: absolute; inset: 0; background: {{p.tone}}; opacity: 0; animation: fh-swapc 6s ease-in-out {{p.delay}} infinite"><span style="position: absolute; left: 32%; top: 16%; width: 36%; height: 36%; border-radius: 50%; background: #FFFDF8; opacity: 0.6"></span><span style="position: absolute; left: 14%; top: 60%; width: 72%; height: 54%; border-radius: 50%; background: #FFFDF8; opacity: 0.6"></span></span></span>
          <span style="padding: 12px 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px">
            <span style="font-weight: 600">{{p.name}}</span>
            <span style="font-size: 14px; color: #6B6358">{{p.rel}}</span>
            <span style="display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 6px">
              <span style="padding: 2px 10px; border-radius: 12px; background: {{p.band}}; font-size: 12px; color: #4A433A">{{p.sideLabel}}</span>
              <sc-if value="{{p.remembered}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 10px; border-radius: 12px; background: #F1EADC; font-size: 12px; color: #4A433A; display: inline-flex; align-items: center; gap: 4px"><svg aria-hidden="true" width="10" height="12" viewBox="0 0 10 12"><path d="M5 11 C1 8 1 3 5 1 C9 3 9 8 5 11 Z" fill="#8E9A86"></path></svg>In memory</span></sc-if>
            </span>
          </span>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5D50","options":["#2F5D50","#8A4B2A","#3D4F7A"]},"$preview":{"width":1280,"height":1260}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'Everyone' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2F5D50';
    // side: p = Pluviose, m = Monestime, b = both, x = married in
    const all = [
      ['Anne-Marie Pluviose', 'Your great-grandmother', 'p', false], ['Darline Monestime', 'Your cousin', 'm', true],
      ['Fabienne Pluviose', 'Your sister-in-law', 'x', true],
      ['Frantz Monestime', 'Your uncle', 'm', true], ['Fritz Pluviose', 'Your brother', 'b', true],
      ['Jean-Baptiste Pluviose', 'Your great-grandfather', 'p', false], ['Jean-Robert Pluviose', 'Your father', 'p', true],
      ['Joseph Pluviose', 'Your grandfather', 'p', false],
      ['Lucien Monestime', 'Your grandfather', 'm', false],
      ['Mackenson Jean-Louis', 'Your son', 'b', true], ['Marie-Claire Pluviose', 'Your grandmother', 'p', false],
      ['Marie-Thérèse Pluviose', 'Your aunt', 'p', true], ['Maya Pluviose', 'You', 'b', true],
      ['Mirlande Monestime', 'Your aunt', 'x', true], ['Nadège Pluviose', 'Your mother', 'm', true],
      ['Naïka Jean-Louis', 'Your daughter', 'b', true], ['Naomie Désir', 'Your granddaughter', 'b', true],
      
      ['Rose Monestime', 'Your grandmother', 'm', true], ['Sabine Pluviose', 'Your half-sister', 'p', true],
      ['Stanley Jean-Louis', 'Your husband', 'x', true]
    ].map(([name, rel, side, living]) => ({ name, rel, side, living }));
    const f = this.state.filter;
    const keep = (p) => f === 'Everyone' || (f === 'Living' && p.living) || (f === 'Remembered' && !p.living) ||
      (f === 'Pluviose side' && (p.side === 'p' || p.side === 'b')) || (f === 'Monestime side' && (p.side === 'm' || p.side === 'b'));
    const tones = ['#9DB3A8', '#B59A86', '#A89478', '#8E9A86', '#A7A08C', '#C2B59B'];
    const side = { p: ['Pluviose side', '#EDF2EE'], m: ['Monestime side', '#F3ECE0'], b: ['Both sides', '#F1EDE3'], x: ['Married in', '#F2EFE8'] };
    const people = all.filter(keep).sort((a, b) => a.name.localeCompare(b.name)).map((p) => {
      const me = p.rel === 'You';
      const parts = p.name.split(' ');
      const h = p.name.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
      return {
        name: p.name, rel: p.rel, remembered: !p.living,
        initials: (parts[0][0] + parts[parts.length - 1][0]).toUpperCase(),
        sideLabel: side[p.side][0], band: me ? '#E6EEE9' : side[p.side][1],
        avBg: me ? accent : '#D9CDB5', avFg: me ? '#FFFFFF' : '#2B2620',
        border: me ? '2px solid ' + accent : '1px solid #E2D9C8',
        tone: tones[h % tones.length], delay: ((h % 11) * 0.6 + 0.8).toFixed(1) + 's'
      };
    });
    const filters = ['Everyone', 'Living', 'Remembered', 'Pluviose side', 'Monestime side'].map((label) => {
      const on = label === f;
      return { label, on, bg: on ? accent : 'transparent', fg: on ? '#FFFFFF' : '#2B2620', border: on ? accent : '#CFC4AF', weight: on ? 600 : 400, pick: () => this.setState({ filter: label }) };
    });
    return { accent, people, filters };
  }
}
</script>
</body>
</html>
