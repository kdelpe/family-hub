version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    # Dev and production run the same Postgres, so one grouped PR moves both.
    directories: ["/", "/deploy"]
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # A Postgres major upgrade needs a dump and restore, so it's done by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # A new Go minor moves with go.mod and CI, by hand.
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # A new Node minor moves with ci.yml's node-version, by hand. A patch PR needs that bumped too.
      - dependency-name: node
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
