version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # A Postgres major upgrade needs a dump and restore, so it's done by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # A new Go minor moves with go.mod and CI, by hand.
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node moves with the web job's node-version in ci.yml, which Dependabot doesn't update, so by hand.
      - dependency-name: node
